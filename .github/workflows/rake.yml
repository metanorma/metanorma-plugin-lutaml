# Formerly cimas-managed. Now consumer-owned per metanorma/cimas#68
# (workflow-file conversion from cimas-synced copied stubs to reusable-workflow
# references). Pins metanorma/ci reusable at @v1 (moving major, three-tier
# tagging discipline per metanorma/ci#372).
name: rake

on:
  push:
    branches: [ master, main ]
    tags: [ v* ]
  pull_request:

permissions:
  contents: write

jobs:
  rake:
    uses: metanorma/ci/.github/workflows/generic-rake.yml@v1
    with:
      # S-411 needs the unreleased ID/IDREF fix (lutaml/lutaml-model#1175).
      # Qualify this integration candidate without changing the released floor.
      # Remove this CI pin when the owner selects a containing release.
      before-setup-ruby: |
        cat > Gemfile.devel <<'RUBY'
        gem "lutaml-model", github: "lutaml/lutaml-model", ref: "c21b2f8d4e91efe6937b6c4637a5102249b8a7e5"
        RUBY
      setup-tools: graphviz
      submodules: true
      choco-cache: true
    secrets:
      pat_token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
