/* header § links */
a.header {

  background: inherit;

}

  color: inherit;
  text-decoration: none;

a.anchor {
  position: absolute;
  z-index: 1001;
  width: 1.5ex;
  margin-left: -1.5ex;
  display: block;
  text-decoration: none !important;
  visibility: hidden;
  text-align: center;
  font-weight: 400;
}

  content: "§";
  font-size: 0.85em;
  display: block;
  padding-top: 0.1em;

  color: #a53221;

h1 > a.anchor:hover,

h4:hover > a.anchor,

}

/* collapsible snippets: collapsible before hidable */
.hidable {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.2s ease-out;
}

.collapsible {
  background-color: #777;
  color: white;
  cursor: pointer;
  padding: 3px 0;
  margin: 0;
  width: 100%;
  border: none;
  text-align: left;
  outline: none;
  font-size: 15px;
}

.active, .collapsible:hover {
  background-color: #555;
}

.collapsible:after {
  content: "▼";
  color: white;
  font-weight: bold;
  float: right;
  margin-left: 12px;
  margin-right: 12px;
}

.active:after {
  content: "▲";
}

/* collapsible: */
.collapsible + .hidable {
  margin-top: 0;
}

.collapsible:not(.active) + .hidable {
  overflow: hidden;
  padding: 0;
}

.svg-container {
  width: 100%; /* or any desired width */
  display: block; /* ← removes unwanted inline spacing */
}

svg {
  width: 100%;
  height: auto; /* ← key to maintaining aspect ratio */
  display: block; /* ← removes unwanted inline spacing */
}

  <script>
    //TOC toggle animation
    (function() {
      const jqNav = $('nav');
      const jqBody = $('body');
      const jqToggle = $('#toggle');
      const animationSpeed = 'slow';

      if(!jqNav.length || !jqToggle.length) {
        return;
      }

      const navWidthExpanded = jqNav.outerWidth();
      const bodyPaddingLeftExpanded =
        parseFloat(jqBody.css('paddingLeft')) > 0 ?
          jqBody.css('paddingLeft') : navWidthExpanded + 'px';
      const expandedToggleLeft = navWidthExpanded + 'px';
      let bandWidth = 0;

      $('.document-stage-band:visible, .document-type-band:visible')
        .each(function() {
          const bounds = this.getBoundingClientRect();
          bandWidth = Math.max(bandWidth, bounds.right);
        });

      const toggleWidth = jqToggle.outerWidth();
      const collapsedToggleLeft = bandWidth + 'px';
      const collapsedBodyPaddingLeft = bandWidth + toggleWidth + 'px';
      jqToggle.css({
        'left': jqNav.is(':visible') ? expandedToggleLeft : collapsedToggleLeft,
        'top': '0px'
      });

      jqToggle.on('click', function() {
        const isNavVisible = jqNav.is(':visible');
        const navLeft = isNavVisible ? '-' + navWidthExpanded + 'px' : '0px';
        const bodyPaddingLeft =
          isNavVisible ? collapsedBodyPaddingLeft : bodyPaddingLeftExpanded;
        const toggleLeft =
          isNavVisible ? collapsedToggleLeft : expandedToggleLeft;

        jqNav.stop(true, true);
        jqBody.stop(true, true);
        jqToggle.stop(true, true);

        if(!isNavVisible) {
          jqNav.show();
        }
        jqNav.animate({'left': navLeft}, animationSpeed, function() {
          if(isNavVisible) {jqNav.hide()}
        });
        jqBody.animate({'paddingLeft': bodyPaddingLeft}, animationSpeed);
        jqToggle.animate({'left': toggleLeft}, animationSpeed);
      });
    })();
  </script>

<script>
// use .collapsible element to toggle visibility of element following it
var coll = document.getElementsByClassName("collapsible");
var i;

for (i = 0; i < coll.length; i++) {
  coll[i].addEventListener("click", function() {
    this.classList.toggle("active");
    var content = this.nextElementSibling;
    if (content.style.maxHeight){
      content.style.maxHeight = null;
    } else {
      content.style.maxHeight = content.scrollHeight + "px";
    }
  });
}
</script>
<script>
$(".collapse-button").click(function () {
$(this).toggleClass('expand'); // expand: the class to change the collapse button shape
// collapse: the class to collapse/expand the li elements with the h2 class
$(this).closest('li').children(".content").toggleClass('collapse');})
</script>
