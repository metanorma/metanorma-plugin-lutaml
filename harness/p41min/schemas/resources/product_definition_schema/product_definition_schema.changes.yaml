---
schema: product_definition_schema
change_edition:
- version: '2'
  description: |-
    The definitions of the following EXPRESS entity data types were modified:

    * action;
    * action_directive;
    * action_method;
    * action_method_relationship;
    * action_relationship;
    * action_request_solution;
    * action_request_status;
    * action_resource;
    * action_resource_relationship;
    * action_resource_type;
    * action_status;
    * directed_action;
    * executed_action;
    * supported_item;
    * versioned_action_request.
  additions:
  - type: FUNCTION
    name: acyclic_product_relationship
  - type: FUNCTION
    name: get_product_definitions
  - type: ENTITY
    name: product_definition_context_association
  - type: ENTITY
    name: product_definition_context_role
  - type: ENTITY
    name: product_relationship
  modifications:
  - type: FUNCTION
    name: acyclic_product_category_relationship
  - type: FUNCTION
    name: acyclic_product_definition_formation_relationship
  - type: FUNCTION
    name: acyclic_product_definition_relationship
  - type: ENTITY
    name: product
  - type: ENTITY
    name: product_category_relationship
  - type: ENTITY
    name: product_definition
  - type: ENTITY
    name: product_definition_relationship
  - type: ENTITY
    name: product_definition_substitute
  - type: ENTITY
    name: product_definition_formation_relationship
  - type: ENTITY
    name: product_definition_effectivity
  - type: ENTITY
    name: product_definition_formation
- version: '3'
  description: |-
    This also incorporates the modifications of Technical Corrigenda 1 and Technical Corrigenda 2.

    The following EXPRESS schemas have been added:

    * experience_schema;
    * location_schema;
    * qualifications_schema.
  additions:
  - type: FUNCTION
    name: categories_of_product
- version: '4'
  description: |-
    The following entity types had been introduced to support external element references outside the local population of entity instances:

    * component_path_shape_aspect;
    * externally_defined_item_with_multiple_references;
    * generic_product_definition_reference;
    * product_definition_reference;
    * product_definition_reference_with_local_representation.

    The following entity types had been introduced to support the the characterization of objects:

    * characterized_chain_based_item_within_representation;
    * characterized_item_within_representation;
    * characterized_product.

    The following select types from the basic_attribute_schema had been converted into extensible selects and then extended in several other schemas:

    * description_attribute_select;
    * id_attribute_select;
    * name_attribute_select;
    * role_select.
  additions:
  - type: REFERENCE_FROM
    name: product_structure_schema
  - type: TYPE
    name: product_definition_or_reference
  - type: TYPE
    name: pds_id_attribute_select
  - type: TYPE
    name: pds_name_attribute_select
  - type: ENTITY
    name: characterized_product
  - type: ENTITY
    name: generic_product_definition_reference
  - type: ENTITY
    name: product_definition_reference
  - type: ENTITY
    name: product_definition_reference_with_local_representation
  modifications:
  - type: REFERENCE_FROM
    name: basic_attribute_schema
  - type: ENTITY
    name: product_definition_relationship
- version: '5'
  description: The change corrected the EXPRESS layout to align to directives
  additions:
  - type: ENTITY
    name: product_definition_relationship_relationship
  modifications:
  - type: TYPE
    name: product_definition_or_reference
- version: '6'
  description: ENTITY basic_attribute's description updated.
  additions:
  - type: ENTITY
    name: alternative_solution_relationship
  - type: ENTITY
    name: final_solution
  - type: FUNCTION
    name: acyclic_alternative_solution_relationship
- version: '7'
  description: WHERE 'WR1' expression changed and 'WR2' deleted
  modifications:
  - type: FUNCTION
    name: acyclic_alternative_solution_relationship
